# =========================================
# TFG-Hospital — application.properties
# NO incluir credenciales reales aqui.
# Usar config/application-secrets.properties (gitignored) o variables de entorno.
# Ver config/application-secrets.properties.example para la plantilla.
# =========================================

spring.application.name=TFG-Hospital

# --- MongoDB ---
# La URI se lee de la variable de entorno MONGODB_URI o del fichero de secrets.
spring.mongodb.uri=${MONGODB_URI}
spring.mongodb.database=${MONGODB_DATABASE:hospital}

# Importa fichero de secrets local (ignorado por git)
spring.config.import=optional:file:./config/application-secrets.properties

# --- Servidor ---
server.port=${SERVER_PORT:8080}

# --- Frontend y Auth ---
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:3000}
app.auth.password-reset.ttl-minutes=60
app.auth.access-token.ttl-minutes=720
app.auth.refresh-token.ttl-days=30
app.mail.from=${MAIL_FROM:Trassierra <support@averonix.org>}

# --- Springdoc / Swagger UI ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method


# --- Healt ---
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.health.mongodb.enabled=false
